apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flink-metrics
  namespace: processor
  labels:
    component: main # must match with the serviceMonitorSelector
spec:
  selector:
    matchLabels: # must match with the Service labels (metadata)
      app: flink-merge-streams
      type: flink-native-kubernetes
  namespaceSelector:
    matchNames:
      - processor
  endpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 30s